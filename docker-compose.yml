# TaskFlow - docker-compose
# Two services: a PHP+Apache web container and a MySQL database container.
# The `web` service live-mounts ./src so you can edit code without rebuilding.
services:
  taskflow-dev:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 80
    container_name: dev_taskflow
    volumes:
      # Live-mount application source for zero-rebuild development.
      - ./src:/var/www/html
    # Credentials come from the .env file (see .env.example). Compose loads
    # ./.env automatically for these ${VAR} substitutions; defaults are used
    # if a variable is unset.
    environment:
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-dev_taskflow}"
      DB_USER: "${DB_USER:-root}"
      DB_PASS: "${DB_PASS:-root}"

    networks:
      - homeserver-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4

networks:
  homeserver-net:
    external: true